spring.application.name=webhookrelay

# H2 in-memory DB for local dev/demo. Swap to postgres datasource for production.
spring.datasource.url=jdbc:h2:mem:webhookrelay
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis (used for rate limiting). Point at a local redis instance.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Retry policy
webhook.retry.max-attempts=5
webhook.retry.base-delay-ms=1000

# Rate limiting: max publish requests per subscription per window
webhook.ratelimit.capacity=20
webhook.ratelimit.refill-per-minute=20
